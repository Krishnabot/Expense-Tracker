name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16  
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/expense_tracker_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby and set up cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version 
          bundler-cache: true          

      - name: Install dependencies
        run: |
          gem install bundler --no-document
          bundle install --jobs 4 --retry 3

      - name: Set up database
        run: |
          bin/rails db:create
          bin/rails db:schema:load   # or db:migrate if you prefer

      - name: Run tests (RSpec)
        run: bundle exec rspec

      # Optional: add linting / other checks
      # - name: Run RuboCop
      #   run: bundle exec rubocop --parallel || true   # --parallel is faster

      # - name: Run security checks (brakeman)
      #   run: bundle exec brakeman -z || true